defaults:
  - _self_
  - data_test:
      - lumina_zs
      - nlbreast_zs
      - cmmd_zs
      - vindr_zs_abnormal
      - vindr_zs
      - rsna_zs
  - dataloader: dataloader_4
  - transform: clahe
  - tokenizer: modernbert

model:
  clip_check_point: ${oc.env:MAMMO_FM_CLIP_CKPT,/restricted/projectnb/batmanlab/shawn24/PhD/Mammo-FM-Test-check/Mammo-FM_BatmanlabTrained_CLIP.tar}

base:
  fold: 0
  seed: 10
  amp: true
  mean: 0.3089279
  std: 0.25053555408335154
  image_size_h: 1520
  image_size_w: 912
  text_max_length: 2048
  modern_bert_cache: ${oc.env:MAMMO_FM_MODERNBERT_DIR,/restricted/projectnb/batmanlab/shawn24/PhD/Mammo-FM-Test-check/text_encoders/modernbert_mlm_5epochs}
  prompts_json: ${hydra:runtime.cwd}/src/zs_prompts/zs_prompts.json
  output:
    save_path: ${hydra:run.dir}

hydra:
  run:
    dir: ${oc.env:MAMMO_FM_ZERO_SHOT_DIR,/restricted/projectnb/batmanlab/shawn24/PhD/Mammo-FM-Test-check/zero_shot/b5}
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        filename: ${hydra.run.dir}/evaluate.log
        formatter: simple
    root:
      level: INFO
      handlers: [file, console]
    disable_existing_loggers: false
